# Lab 4 — local observability stack: Prometheus + Pushgateway + Grafana.
#
#   docker compose -f monitoring/docker-compose.yml up -d
#   uvicorn service.app:app --port 8080 --workers 1      # ONE worker: counters are per process
#   k6 run -e TARGET=http://localhost:8080 loadtest/k6.js
#   open http://localhost:3000   (dashboard "ITCS355 - Prediction service", anonymous admin)
#
# The service runs on the host; Prometheus reaches it through host.docker.internal.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  pushgateway:
    image: prom/pushgateway:v1.10.0
    ports: ["9091:9091"]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
