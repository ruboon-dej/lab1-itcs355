# ITCS355 Lab 4 — continuous deployment to staging (Azure Container Apps).
#
# Runs only on main, only after CI is green, only through the `staging` environment.
# Credentials: OIDC federation to a user-assigned managed identity. No long-lived key is
# stored anywhere. (An Entra app registration is blocked in the university tenant.)
#
# Why the image is rebuilt here: adapter.deploy() pushes a LOCAL image, and this workflow
# runs on a different runner from CI's build job. The rebuild is from the exact commit CI
# tested (head_sha) and is tagged with that SHA, never `latest`.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      # The eight capability slots (cloud.env is gitignored, so they come from repo variables).
      CLOUD_PROVIDER: azure
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      BLOB_URI: ${{ vars.BLOB_URI }}
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
      IDENTITY_REF: ${{ vars.IDENTITY_REF }}
      # Read directly by the Azure adapter.
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      ENDPOINT_NAME: ${{ vars.STAGING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name ${{ vars.ACR_NAME }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install adapter dependencies (hash-locked, no mlflow)
        run: pip install -r requirements-ops.txt

      - uses: docker/setup-buildx-action@v3

      - name: Build serving image (tagged with the commit SHA)
        run: |
          docker buildx build --platform linux/amd64 -f service/Dockerfile.serve \
            -t "itcs355-serve:${SHA}" --load .

      - name: Push the image to the registry
        id: push
        env:
          SERVE_IMAGE_TAG: itcs355-serve:${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import os
          from src import config
          from cloudlayer.factory import get_adapter

          uri = get_adapter(config.load()).push_image(os.environ["SERVE_IMAGE_TAG"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"image_uri={uri}\n")
          print("pushed", uri)
          PY

      # Why this is not adapter.deploy(): that method creates the app with a public image,
      # saves the registry login in a SEPARATE command, then switches to the private image.
      # In this subscription the saved login did not stick (the app's registry list stayed
      # empty) and Azure refused the pull with "authentication failed", although the same
      # credentials, image and environment worked for another app. Passing the registry
      # login inside the create command works, so the workflow does it that way.
      - name: Create or update the staging app (registry login in the same command)
        env:
          IMAGE_URI: ${{ steps.push.outputs.image_uri }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          set -euo pipefail
          APP="$ENDPOINT_NAME"; RG="$AZURE_RESOURCE_GROUP"; SERVER="${ACR_NAME}.azurecr.io"
          az acr update --name "$ACR_NAME" --resource-group "$RG" --admin-enabled true -o none
          ACR_USER=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
          ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASS"
          VARS=("MODEL_VERSION=$SHA" "MODEL_REGISTRY_NAME=$MODEL_REGISTRY_NAME" "MODEL_PATH=/app/model/model.joblib")

          create_app() {
            az containerapp create --name "$APP" --resource-group "$RG" \
              --environment "$AZURE_CONTAINERAPPS_ENVIRONMENT" --image "$IMAGE_URI" \
              --registry-server "$SERVER" --registry-username "$ACR_USER" --registry-password "$ACR_PASS" \
              --target-port 8080 --ingress external --min-replicas 0 --max-replicas 1 \
              --cpu 0.5 --memory 1.0Gi --env-vars "${VARS[@]}" -o none
          }
          update_app() {
            az containerapp registry set --name "$APP" --resource-group "$RG" \
              --server "$SERVER" --username "$ACR_USER" --password "$ACR_PASS" -o none
            az containerapp update --name "$APP" --resource-group "$RG" --image "$IMAGE_URI" \
              --cpu 0.5 --memory 1.0Gi --min-replicas 0 --max-replicas 1 \
              --set-env-vars "${VARS[@]}" -o none
          }

          if az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            if ! update_app; then
              echo "::warning::updating the existing staging app failed; recreating it (staging is disposable)"
              az containerapp delete --name "$APP" --resource-group "$RG" --yes -o none
              create_app
            fi
          else
            create_app
          fi
          echo "staging app ready: $APP running image $IMAGE_URI"

      - name: Smoke test (three known payloads)
        run: |
          python - <<'PY'
          import os
          from src import config
          from cloudlayer.factory import get_adapter

          adapter = get_adapter(config.load())
          endpoint = os.environ["ENDPOINT_NAME"]
          sha = os.environ["SHA"]
          payloads = [
              {"temp_c": 70.0, "vibration_mm_s": 5.0, "pressure_kpa": 100.0,
               "hours_since_service": 1000.0, "load_pct": 50.0, "ambient_humidity": 50.0},
              {"temp_c": 78.4, "vibration_mm_s": 3.1, "pressure_kpa": 315.2,
               "hours_since_service": 4200.0, "load_pct": 68.0, "ambient_humidity": 55.0},
              {"temp_c": 95.0, "vibration_mm_s": 9.0, "pressure_kpa": 340.0,
               "hours_since_service": 8800.0, "load_pct": 95.0, "ambient_humidity": 70.0},
          ]
          import time
          for payload in payloads:
              for attempt in range(6):  # the app scales to zero, so the first call can be a cold start
                  try:
                      out = adapter.invoke(endpoint, payload)
                      break
                  except Exception as exc:  # noqa: BLE001
                      print(f"attempt {attempt + 1} failed: {exc}")
                      time.sleep(15)
              else:
                  raise SystemExit("smoke test: the service never answered")
              assert 0.0 <= out["probability"] <= 1.0, out
              assert out["model_version"] == sha, f"serving {out['model_version']}, expected {sha}"
              print("ok", out)
          print("smoke test passed: all three payloads scored by the deployed version", sha)
          PY
