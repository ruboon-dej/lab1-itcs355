# Provider-neutral pipeline spec. Step LOGIC lives in the images (scripts/, src/);
# this file only says what runs, in what order, and under which condition.
# cloudlayer/pipelines.py turns it into a provider pipeline (Azure ML Pipelines here).
name: itcs355-lab5-retrain
experiment: itcs355-lab5
tags: {course: itcs355, lab: "5"}

parameters:
  data_seed: 20260101        # fixed on purpose: candidate and incumbent see the same data
  model_seed: 20260101
  n_estimators: 100
  max_depth: 4
  min_samples_leaf: 5
  floor: 0.75                # absolute floor on the validation metric
  margin: 0.0075             # must beat the incumbent by this much (about one seed of noise)
  allow_bootstrap: true      # first run only: no production model exists yet. Flip to false.

compute:
  instance: Standard_DS2_v2  # dedicated: Azure ML low-priority quota is 0 on this subscription
  spot: false
  min_nodes: 0
  max_nodes: 1
  idle_seconds: 120
  step_timeout_seconds: 900

steps:
  - name: ingest
    image: train
    produces: data
  - name: validate            # data contract tests; a failure stops the pipeline
    image: train
    needs: [ingest]
  - name: train
    image: train
    needs: [validate]
    produces: model_dir
  - name: gate                # writes decision.json and a boolean control output
    image: ops
    needs: [train]
    produces: go
  - name: register            # reachable only when the gate says go
    image: ops
    needs: [gate]
    condition: gate.go == true
